---
# Kyverno validates the policies via its webhooks, which can briefly refuse connections right after the installation,
# until the endpoints of the Service are ready. So the policy is applied until it's accepted.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      for attempt in $(seq 1 20); do
        if kubectl apply -f policy.yaml; then
          exit 0
        fi
        sleep 3
      done
      exit 1
