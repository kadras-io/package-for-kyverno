---
# The package is deleted with kapp, as kapp-controller does when deleting the PackageInstall:
# `kctrl dev --delete` doesn't delete the resources of a local installation.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
delete:
  - apiVersion: policies.kyverno.io/v1
    kind: ValidatingPolicy
    name: require-team-label
commands:
  - script: kapp delete -a kyverno.app -n tests -y
