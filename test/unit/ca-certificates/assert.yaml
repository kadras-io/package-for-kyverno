apiVersion: v1
kind: Secret
metadata:
  name: kyverno-ca-certificates
  namespace: kyverno
type: Opaque
stringData:
  (starts_with("ca.crt", '-----BEGIN CERTIFICATE-----')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
spec:
  template:
    spec:
      (volumes[?name == 'ca-certificates'] | [0].secret.secretName): kyverno-ca-certificates
      (containers[?name == 'kyverno'] | [0]):
        # The certificates are added to the system ones, not replacing them.
        (env[?name == 'SSL_CERT_DIR'] | [0].value): /etc/ssl/certs-extra
        (volumeMounts[?name == 'ca-certificates'] | [0].mountPath): /etc/ssl/certs-extra
        (volumeMounts[?mountPath == '/etc/ssl/certs/ca-certificates.crt'] | length(@)): 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-background-controller
spec:
  template:
    spec:
      (volumes[?name == 'ca-certificates'] | [0].secret.secretName): kyverno-ca-certificates
