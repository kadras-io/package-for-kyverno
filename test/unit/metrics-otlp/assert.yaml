apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
spec:
  template:
    metadata:
      # The metrics are pushed, not scraped.
      (annotations == null || annotations."prometheus.io/scrape" == null): true
    spec:
      (containers[?name == 'kyverno'] | [0]):
        (contains(args, '--disableMetrics=false')): true
        (contains(args, '--otelConfig=grpc')): true
        (contains(args, '--otelCollector=otel-collector.observability.svc')): true
        (args[?starts_with(@, '--metricsPort=')]): [--metricsPort=4317]
        (contains(args, '--transportCreds=otel-ca')): true
---
