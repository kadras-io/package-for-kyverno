apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: admission-controller
  policyTypes:
  - Ingress
  # Without metrics, only the webhook port.
  ingress:
  - ports:
    - protocol: TCP
      port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-cleanup-controller
  namespace: kyverno
spec:
  ingress:
  - ports:
    - protocol: TCP
      port: 9443
---
# Without metrics, no inbound traffic at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-background-controller
  namespace: kyverno
spec:
  policyTypes:
  - Ingress
  (ingress == null): true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-reports-controller
  namespace: kyverno
spec:
  (ingress == null): true
